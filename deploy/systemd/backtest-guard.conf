# 백테스트 격리 drop-in (v5.1) — /etc/systemd/system/<app>-backtest.service.d/v51-guard.conf
# 2026-10-20 pochaco(1GB): 백테스트 RSS ~517MB → OOM → 크래시루프로 sshd·대시보드까지 먹통.
# cgroup 상한 + 최우선 OOM 대상 + 낮은 CPU 우선순위로 호스트·매매 봇 보호.
# ※ pochaco(1GB)는 타이머 영구 비활성 — 백테스트는 로컬에서만.
[Service]
MemoryMax=600M
MemorySwapMax=0
OOMScoreAdjust=500
Nice=10
